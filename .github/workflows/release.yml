name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_existing:
        description: Publish the current checkout when a release tag already exists
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  align-release-pr:
    name: Align release pull request
    needs: release-please
    if: needs.release-please.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Sync versions onto the release branch
        run: |
          set -euo pipefail
          branch="release-please--branches--main--components--workhold"
          if ! git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "No open release branch."
            exit 0
          fi
          git fetch --depth=1 origin "$branch"
          git checkout --detach FETCH_HEAD
          uv run python tools/sync_coordinated_version.py
          uv lock
          git add -u -- pyproject.toml src/workhold/__init__.py packages uv.lock
          if git diff --cached --quiet; then
            echo "Release branch versions and lockfile already match."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): sync coordinated versions and lockfile"
          git push origin "HEAD:${branch}"

  publish:
    name: Publish
    needs: release-please
    if: >-
      needs.release-please.outputs.release_created == 'true' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_existing == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install
        run: uv sync --frozen --all-packages --group dev

      - name: Client release gate
        run: uv run python tools/client_release_gate.py

      - name: Image name
        id: image
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          version="${RELEASE_VERSION#v}"
          if [ -z "${version}" ]; then
            version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          fi
          if [ -z "${version}" ]; then
            echo "release version is empty"
            exit 1
          fi
          ghcr="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=${ghcr}" >> "$GITHUB_OUTPUT"
          echo "tag=${version}" >> "$GITHUB_OUTPUT"
          tags="${ghcr}:${version}"$'\n'"${ghcr}:${GITHUB_SHA}"
          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
            hub="docker.io/${DOCKERHUB_USERNAME,,}/workhold"
            tags="${tags}"$'\n'"${hub}:${version}"$'\n'"${hub}:${GITHUB_SHA}"
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docker Hub credentials are unset; pushing GHCR only."
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "tags<<EOF"
            printf '%s\n' "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.image.outputs.dockerhub == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.image.outputs.tags }}

      - name: Publish workhold-client-core
        env:
          WORKHOLD_PUBLISH: "1"
          WORKHOLD_PUBLISH_ONLY: workhold-client-core
        run: uv run python tools/publish_client_packages.py

  publish-roles:
    name: Publish ${{ matrix.package }}
    needs: [release-please, publish]
    if: >-
      needs.publish.result == 'success' &&
      (needs.release-please.outputs.release_created == 'true' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_existing == 'true'))
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: workhold-producer
            environment: pypi-workhold-producer
          - package: workhold-consumer
            environment: pypi-workhold-consumer
          - package: workhold-admin
            environment: pypi-workhold-admin
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install
        run: uv sync --frozen --all-packages --group dev

      - name: Publish ${{ matrix.package }}
        env:
          WORKHOLD_PUBLISH: "1"
          WORKHOLD_PUBLISH_ONLY: ${{ matrix.package }}
        run: uv run python tools/publish_client_packages.py
