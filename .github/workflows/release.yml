name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_existing:
        description: Republish the current checkout when its release tag already exists
        type: choice
        options:
          - none
          - server
          - clients
          - mcp
          - all
        default: none

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_BRANCH: release-please--branches--main

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      server_version: ${{ steps.release.outputs.version }}
      publish_server: ${{ steps.targets.outputs.server }}
      publish_clients: ${{ steps.targets.outputs.clients }}
      publish_mcp: ${{ steps.targets.outputs.mcp }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Select publish targets
        id: targets
        env:
          SERVER_RELEASED: ${{ steps.release.outputs.release_created }}
          CLIENTS_RELEASED: ${{ steps.release.outputs['packages--release_created'] }}
          MCP_RELEASED: ${{ steps.release.outputs['packages/workhold-mcp--release_created'] }}
          PUBLISH_EXISTING: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_existing || 'none' }}
        run: |
          set -euo pipefail
          server=false
          clients=false
          mcp=false
          if [ "${SERVER_RELEASED}" = "true" ] || [ "${PUBLISH_EXISTING}" = "server" ] || [ "${PUBLISH_EXISTING}" = "all" ]; then
            server=true
          fi
          if [ "${CLIENTS_RELEASED}" = "true" ] || [ "${PUBLISH_EXISTING}" = "clients" ] || [ "${PUBLISH_EXISTING}" = "all" ]; then
            clients=true
          fi
          if [ "${MCP_RELEASED}" = "true" ] || [ "${PUBLISH_EXISTING}" = "mcp" ]; then
            mcp=true
          fi
          echo "server=${server}" >> "$GITHUB_OUTPUT"
          echo "clients=${clients}" >> "$GITHUB_OUTPUT"
          echo "mcp=${mcp}" >> "$GITHUB_OUTPUT"
          echo "Publish server image: ${server}; publish client packages: ${clients}; publish MCP package: ${mcp}"

  align-release-pr:
    name: Align release pull request
    needs: release-please
    if: needs.release-please.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Detect release branch
        id: release-branch
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "${RELEASE_BRANCH}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No open release branch."
          fi

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        if: steps.release-branch.outputs.exists == 'true'
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Sync versions onto the release branch
        if: steps.release-branch.outputs.exists == 'true'
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "${RELEASE_BRANCH}"
          git checkout --detach FETCH_HEAD
          uv run python tools/sync_coordinated_version.py
          uv lock
          git add -u -- pyproject.toml src/workhold/__init__.py packages uv.lock
          if git diff --cached --quiet; then
            echo "Release branch versions and lockfile already match."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): sync coordinated versions and lockfile"
          git push origin "HEAD:${RELEASE_BRANCH}"

  publish-image:
    name: Publish runtime image
    needs: release-please
    if: needs.release-please.outputs.publish_server == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Image name
        id: image
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.server_version }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          version="${RELEASE_VERSION#v}"
          if [ -z "${version}" ]; then
            version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          fi
          if [ -z "${version}" ]; then
            echo "release version is empty"
            exit 1
          fi
          ghcr="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=${ghcr}" >> "$GITHUB_OUTPUT"
          echo "tag=${version}" >> "$GITHUB_OUTPUT"
          tags="${ghcr}:${version}"$'\n'"${ghcr}:${GITHUB_SHA}"
          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
            hub="docker.io/${DOCKERHUB_USERNAME,,}/workhold"
            tags="${tags}"$'\n'"${hub}:${version}"$'\n'"${hub}:${GITHUB_SHA}"
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docker Hub credentials are unset; pushing GHCR only."
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "tags<<EOF"
            printf '%s\n' "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: steps.image.outputs.dockerhub == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.image.outputs.tags }}

  publish-client-core:
    name: Publish workhold-client-core
    needs: release-please
    if: needs.release-please.outputs.publish_clients == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install
        run: uv sync --frozen --all-packages --group dev

      - name: Client release gate
        run: uv run python tools/client_release_gate.py

      - name: Publish workhold-client-core
        env:
          WORKHOLD_PUBLISH: "1"
          WORKHOLD_PUBLISH_ONLY: workhold-client-core
        run: uv run python tools/publish_client_packages.py

  publish-roles:
    name: Publish ${{ matrix.package }}
    needs: [release-please, publish-client-core]
    if: needs.publish-client-core.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: workhold-producer
            environment: pypi-workhold-producer
          - package: workhold-consumer
            environment: pypi-workhold-consumer
          - package: workhold-admin
            environment: pypi-workhold-admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install
        run: uv sync --frozen --all-packages --group dev

      - name: Publish ${{ matrix.package }}
        env:
          WORKHOLD_PUBLISH: "1"
          WORKHOLD_PUBLISH_ONLY: ${{ matrix.package }}
        run: uv run python tools/publish_client_packages.py

  publish-mcp:
    name: Publish workhold-mcp
    needs: release-please
    if: needs.release-please.outputs.publish_mcp == 'true'
    runs-on: ubuntu-latest
    environment: pypi-workhold-mcp
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install
        run: uv sync --frozen --all-packages --group dev

      - name: Client release gate
        run: uv run python tools/client_release_gate.py

      - name: Publish workhold-mcp
        env:
          WORKHOLD_PUBLISH: "1"
        run: uv run python tools/publish_mcp_package.py
