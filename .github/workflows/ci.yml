name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-release-versions:
    name: Sync release versions
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'release-please--') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Align coordinated versions
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -euo pipefail
          uv run python tools/sync_coordinated_version.py
          git add -u -- pyproject.toml src/queue_service/__init__.py packages
          if git diff --cached --quiet; then
            echo "versions already coordinated"
            exit 0
          fi
          echo "Coordinated version files differ from the root version."
          git diff --cached
          if [ -z "${RELEASE_PLEASE_TOKEN}" ]; then
            echo "Commit the diff, or set RELEASE_PLEASE_TOKEN so this job can push it."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): sync coordinated version files"
          git push "https://x-access-token:${RELEASE_PLEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_HEAD_REF}"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: sync-release-versions
    if: always() && (needs.sync-release-versions.result == 'success' || needs.sync-release-versions.result == 'skipped')
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install
        run: uv sync --frozen --all-packages --group dev

      - name: Unit tests and client publication preflight
        run: |
          uv run pytest tests/unit -q
          uv run python tools/check_client_operation_ownership.py
          uv run pytest tests/sdk/test_package_release_matrix.py tests/sdk/test_client_release_gate.py tests/sdk/test_sync_coordinated_version.py -q
          uv run python tools/client_release_gate.py

  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: runtime
          push: false
          tags: queue-service:ci
