name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-release-versions:
    name: Sync release versions
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'release-please--') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Require coordinated versions
        run: |
          set -euo pipefail
          uv run python tools/sync_coordinated_version.py
          if ! git diff --quiet -- pyproject.toml src/workhold/__init__.py packages; then
            echo "Coordinated version files differ from the root version."
            git diff -- pyproject.toml src/workhold/__init__.py packages
            echo "Release Please should have updated these files on the release branch."
            exit 1
          fi
          if ! uv lock --check; then
            echo "uv.lock does not match the release version."
            echo "The Release workflow should have committed the refreshed lockfile."
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: sync-release-versions
    if: always() && (needs.sync-release-versions.result == 'success' || needs.sync-release-versions.result == 'skipped')
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install
        run: uv sync --frozen --all-packages --group dev

      - name: Unit tests and client publication preflight
        run: |
          uv run pytest tests/unit -q
          uv run python tools/check_client_operation_ownership.py
          uv run pytest tests/sdk/test_package_release_matrix.py tests/sdk/test_client_release_gate.py tests/sdk/test_sync_coordinated_version.py -q
          uv run python tools/client_release_gate.py

  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker

      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: runtime
          push: false
          tags: workhold:ci
