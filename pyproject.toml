[project]
name = "workhold"
version = "1.0.4"
description = "Workhold - Durable work queue"
authors = [
    { name = "Mikhail Konin", email = "dev.konin@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "psycopg[binary]>=3.3.5",
    "sentry-sdk>=2.69.2,<3",
    "sqlalchemy>=2.0.54",
]

[project.scripts]
workhold = "workhold.cli:run"

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "workhold"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "httpx>=0.28.0",
]

[tool.uv.workspace]
members = [
    "packages/workhold-client-core",
    "packages/workhold-producer",
    "packages/workhold-consumer",
    "packages/workhold-admin",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
