[project]
name = "workhold-consumer"
version = "1.0.1"
description = "Workhold consumer client (claim, fenced leases, and ConsumerSupervisor)"
authors = [
    { name = "Mikhail Konin", email = "dev.konin@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "workhold-client-core>=1.0.0,<1.1.0",
]

[project.optional-dependencies]
async = [
    "workhold-client-core[async]>=1.0.0,<1.1.0",
]

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "workhold_consumer"

[tool.uv.sources]
workhold-client-core = { workspace = true }
