[project]
name = "workhold-client-core"
version = "1.0.4"
description = "Private shared transport, errors, and wire models for Workhold role clients"
authors = [
    { name = "Mikhail Konin", email = "dev.konin@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
async = [
    "httpx>=0.28",
]

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["_workhold_client_core", "workhold_client_testing"]
